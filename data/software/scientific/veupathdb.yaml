description: VEuPathDB is the Eukaryotic Pathogen, Vector and Host Informatics Resource.
  Organism sites (AmoebaDB, CryptoDB, FungiDB, GiardiaDB, HostDB, MicrosporidiaDB,
  PiroplasmaDB, PlasmoDB, ToxoDB, TrichDB, TriTrypDB, VectorBase, and the VEuPathDB
  hub) plus OrthoMCL, ClinEpiDB, and MicrobiomeDB share the EuPathDB Web Development
  Kit (WDK) for genome, isolate, experiment, and related data with a common search-strategy
  UI and REST web services.
