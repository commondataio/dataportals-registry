description: Tripal is an open-source toolkit for constructing online biological databases.
  It is a Drupal module suite on the GMOD Chado schema, used by community genome databases
  (CottonGEN, SoyBase, PeanutBase, GDR, TreeGenes, and others) to publish genes, maps,
  germplasm, and related datasets.
