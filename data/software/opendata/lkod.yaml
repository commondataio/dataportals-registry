description: LKOD (Lokální katalog otevřených dat) is an open-source local open-data
  catalog from Golemio / Operátor ICT. It implements DCAT-AP-CZ, harvests into the
  Czech National Open Data Catalog (NKOD), and is deployed as Next.js catalogs on
  lkod.cz or self-hosted instances for Czech public bodies.
