name: Idra
description: Idra is an open-source Open Data Federation Platform from Engineering
  Ingegneria Informatica (FIWARE). It harvests heterogeneous ODMS catalogues (CKAN,
  DKAN, Socrata, OpenDataSoft, NGSI, DCAT-AP dumps, and scraped sites), harmonizes
  metadata to DCAT-AP / DCAT-AP_IT, and exposes a search portal, REST API, and SPARQL
  endpoint.
