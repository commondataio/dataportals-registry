name: Geocortex Essentials
website: https://www.geocortex.com
description: Geocortex Essentials (now VertiGIS Studio) is a commercial web GIS that
  extends Esri ArcGIS with configurable sites and the Geocortex Viewer for HTML5.
  Public geoportals typically expose a Geocortex Essentials REST Sites Directory
  (often /Geocortex/Essentials/REST/sites, ?f=pjson) and/or an Html5Viewer titled
  Geocortex Viewer for HTML5. Hosted tenants appear under *.geocortex.com. Distinct
  from VertiGIS WebOffice (weboffice).
