id: qgisserver
name: QGIS Server
website: https://qgis.org
description: QGIS Server is the OGC map and feature server bundled with QGIS. It publishes
  QGIS projects as WMS, WFS, WCS, and OGC API services (typical CGI/FastCGI path
  qgis_mapserv.fcgi, often with MAP=.qgs). Register it when QGIS Server is the public
  catalog. Do not add a second record when Lizmap, QWC2, or mviewer on the same host
  is the public product.
