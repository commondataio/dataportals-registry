description: GP Atlas (геоинформационная платформа «Атлас») is a web GIS from
  the Territorial Information Fund of the Komi Republic for publishing
  interactive maps, searching and analyzing spatial data, and managing user
  access. Public catalogs include the Komi geoportal (gis.rkomi.ru), the Kirov
  Oblast geoportal (gis.geokirov.ru), and the Arkhangelsk forest-dispatcher
  Atlas (fires.dvinaland.ru).
