id: gvsigonline
name: gvSIG Online
website: https://www.gvsig.com
description: gvSIG Online is an open-source web platform for building spatial data
  infrastructures and municipal geoportals. It provides an administration UI for publishing
  layers, defining symbology, creating map viewers, and managing permissions, and
  integrates GeoServer (required) and optionally GeoNetwork for OGC services and
  metadata cataloguing. It is developed by the gvSIG Association and Scolab and is
  licensed under the Affero GPL.
