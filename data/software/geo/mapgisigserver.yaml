id: mapgisigserver
description: MapGIS IGServer is Zondy Cyber's enterprise GIS server for publishing,
  managing, and sharing spatial data. .NET (often port 6163) and Java (often port
  8089) editions expose a REST catalog under /igs/rest/ plus OGC WMS, WFS, WMTS,
  WCS, and CSW. IGS 1.0 lists map documents at /igs/rest/mrcs/docs; IGS 2.0 lists
  services at /igs/rest/services.
