name: VertiGIS WebOffice
website: https://www.vertigis.com
description: VertiGIS WebOffice (formerly SynerGIS WebOffice) is a commercial web
  GIS that extends Esri ArcGIS Enterprise with configurable map clients. Public geoportals
  typically expose a /synserver (or /WebOffice/synserver) application titled VertiGIS
  WebOffice, often with weboffice_packed.css and core, flex, or mobile clients. Multi-tenant
  hosting appears under wo-hosting.vertigis.com and map.geoportal.at.
