description: disy Cadenza is a commercial data analytics, reporting, and GIS platform
  from Disy Informationssysteme. German public-sector geoportals typically expose
  Cadenza Web or Cadenza Workbooks as a browser catalog of maps, tables, charts, and
  dashboards. Classic installs use JSF paths such as /cadenza/, /public/, or /pages/map/;
  Workbooks installs use a navigator of workbooks. Page fingerprints include cadenza
  in HTML/JS, disy branding, and often a guest login before the public theme tree.
