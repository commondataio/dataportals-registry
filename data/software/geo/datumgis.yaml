description: DATUM GIS is a web geoinformation platform from DATUM Soft for
  publishing, editing, and analyzing spatial data in regional and municipal GIS
  portals. It supports map visualization, object cards with attached documents,
  metadata search, import and export, geocoding, and modular extensions. The
  product is listed in the Russian software registry and is used for regional
  SDI and GIS OGD deployments.
