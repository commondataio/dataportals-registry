description: Geonomics is a regional geoportal platform for collecting, storing,
  visualizing, and analyzing spatial data. Deployments share a Vue SSR and Express
  web application with Mapbox GL maps, collection APIs, EDS login, and optional
  GeoServer backends. It is used by Kazakhstani akimats for land, urban-planning,
  and administrative-territorial layers.
