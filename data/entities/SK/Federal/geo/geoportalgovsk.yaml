description: National Geoportal of Slovakia (Národný geoportál). Central web access
  point to spatial data and services of the National Infrastructure for Spatial Information
  (NIPI) under Act No. 3/2010. Provides search, viewing, and download of public-administration
  geodata through thematic maps, a metadata-backed dataset catalogue from the Register
  of Spatial Information (RPI), and a directory of data providers.
