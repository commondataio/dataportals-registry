description: Official Ministry of Health Zambia platform (Z360DASP) for discovering
  and requesting controlled access to curated national health datasets drawn from
  SmartCare Pro (the national EHR) and the national health data warehouse. Users can
  browse dataset metadata and request time-bound access to full datasets or selected
  variables, subject to MoH, IRB, and NHRA approval. Published collections include
  de-identified client-level records for HIV ART cohorts, COVID-19, immunization,
  and non-communicable diseases.
