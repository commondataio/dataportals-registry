description: Open data portal of the Santa Coloma de Gramenet City Council (Ajuntament
  de Santa Coloma de Gramenet) providing access to municipal datasets in open formats.
  The portal promotes transparency and facilitates the reuse of public sector information
  for citizens, businesses, and researchers. Datasets cover municipal administration,
  public services, urban planning, budgets, contracts, subsidies, and local governance.
  Santa Coloma de Gramenet is a municipality in the province of Barcelona, Catalonia,
  Spain, in the Barcelona metropolitan area.
