description: Open data portal of the Mataró City Council (Ajuntament de Mataró) providing
  access to municipal datasets in open formats. The portal promotes transparency and
  facilitates the reuse of public sector information for citizens, businesses, and
  researchers. Datasets cover municipal administration, public services, budgets,
  public procurement, subsidies, urban planning, and local governance. Mataró is a
  coastal municipality and the capital of the Maresme comarca in the province of Barcelona,
  Catalonia, Spain.
