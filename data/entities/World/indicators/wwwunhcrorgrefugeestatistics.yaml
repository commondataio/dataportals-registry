description: UNHCR Refugee Data Finder provides global statistics on forcibly displaced
  and stateless populations, including refugees, asylum-seekers, internally displaced
  persons, and durable solutions such as repatriation and resettlement. Data covers
  nearly 70 years of UNHCR statistical activities, with demographic and sub-national
  breakdowns available through the website and a public REST API.
