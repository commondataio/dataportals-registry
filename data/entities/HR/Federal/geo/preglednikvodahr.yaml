description: Interactive geoportal of Hrvatske vode (Croatian Waters) for viewing
  and analysing national water-management spatial data. Thematic layers include agglomeration
  registers, flood hazard and risk maps, preliminary flood risk assessment, and protected
  water areas. OGC map and feature services are published through GeoServer.
