description: Intercantonal portal for accessing official geodata and geoservices.
  Cantonal and municipal geobasis data are aggregated in a structurally harmonized
  form for Switzerland and Liechtenstein. Offers WMS, WFS, OGC API Features, Atom,
  STAC, and a REST API. Access conditions are defined by the cantons.
