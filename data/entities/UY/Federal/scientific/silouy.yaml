description: SILO is Uruguay's national portal for open-access science and technology
  digital repositories. It aggregates research and development outputs from member
  institutional repositories, promotes visibility of national scientific production,
  and provides records to regional and global aggregators through common standards.
  SILO is an initiative of the Agencia Nacional de Investigación e Innovación (ANII)
  and is Uruguay's node in LA Referencia.
