description: Institute of Oceanography and Environment (INOS), Universiti Malaysia Terengganu
  is the leading research institute in Malaysia focusing on oceanography and marine science.
  INOS has been recognised by Ministry of Education, Malaysia as ‘Higher Institution Centre
  of Excellence’ (HICOE) in marine science. On the international scale, INOS is one of Associate
  Data Unit and Ocean Biogeographic Information System Node under International Oceanographic
  Data and Information Exchange (IODE). The South China Sea Repository and Reference Centre
  (RRC) under INOS is currently housing more than 20,000 marine specimens and recognised by
  the Ministry of Water, Land and Natural Resources, Malaysia as the main centre for marine
  collection in Malaysia.
