description: The Language Bank of Finland (Kielipankki) is a service for researchers
  using language resources across digital humanities and social sciences. It hosts
  text, speech and video corpora in over 60 languages, with tools for analysing and
  downloading them. Many corpora are publicly accessible; restricted resources can
  be applied for electronically. The service is coordinated by the national FIN-CLARIN
  consortium and is part of CLARIN ERIC.
