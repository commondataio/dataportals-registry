description: Este IPT é mantido e operado pelo Sistema de Informação sobre a Biodiversidade
  Brasileira (SiBBr). Foi criado com o objetivo de realizar o monitoramento ambiental da recuperação
  da bacia do Rio Doce. Sua finalidade é facilitar a publicação e o acesso aberto aos dados
  gerados em decorrência do rompimento da barragem de Fundão, ocorrido em 2015. Contribuem
  com este IPT todas as instituições e fornecedores envolvidos no monitoramento ambiental.
