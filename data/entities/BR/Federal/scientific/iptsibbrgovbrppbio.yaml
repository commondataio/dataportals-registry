description: 'O Programa de Pesquisa em Biodiversidade (PPBio) foi criado em 2004 com o objetivo
  de intensificar estudos sobre biodiversidade no Brasil, descentralizar a produção científica
  dos centros desenvolvidos academicamente, integrar atividades de pesquisa e divulgar os
  resultados para diferentes finalidades, como gestão ambiental e educação. Ele está estruturado
  em três componentes principais: Inventários, Coleções e Temáticos e possui diversos Núcleos
  Regionais e Projeto Parceiros pelo país.'
