description: National OpenAIRE CONNECT gateway for Dutch research output, replacing
  NARCIS in 2023. It covers publications, datasets, research software, and projects
  from Dutch institutional repositories and CRIS systems, linked to NWO grants and
  research performing organisations (UNL, VH, KNAW, NFU). Developed by UKB, SURF and
  OpenAIRE as a Netherlands-filtered view of the OpenAIRE Graph.
