description: The Global Freshwater Quality Database GEMStat provides scientifically-sound
  data and information on the state and trend of global inland water quality. Hosted
  by the GEMS/Water Data Centre at the International Centre for Water Resources and
  Global Change in Koblenz, it is the operational database of the UNEP GEMS/Water
  Programme. The catalog holds surface and groundwater monitoring data from participating
  countries, with a public data portal, water quality indicators, and statistical
  reports. Open-licensed records (CC BY 4.0) are also published on Zenodo.
