description: Esta instancia IPT se encuentra en el marco de la misión del Instituto. Promover,
  coordinar y realizar investigación que contribuya al conocimiento, la conservación y el
  uso sostenible de la biodiversidad como un factor de desarrollo y bienestar de la población
  colombiana. En esta instancia se publicarán conjuntos de datos primarios sobre biodiversidad,
  derivados de sus colecciones biológicas y observaciones en campo, asi como listas de chequeo
  para Colombia.
