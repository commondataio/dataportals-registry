description: 'he University of Liberia was founded in 1862 as Liberia College and became a
  full University in 1951. It is a public institution funded mainly by the Government of Liberia.
  The University now has four campuses: Capitol Hill, Fendall, Medical School Fendall, and
  Starz-Sinji campus located in Sinji, Grand Cape Mount County. Biodiversity research at the
  university is carried out by the Department of General Forestry. Faculty members at the
  department are activiely engaged in field research aimed at documenting Liberia’s biodiversity.'
