description: Nationwide listing of publicly available high-accuracy topographic and
  bathymetric source elevation data for the United States and its territories. The
  inventory shows completed and in-progress lidar, IfSAR, and bathymetry dataset footprints
  and attributes, with links to data, metadata, and reports, but does not host the
  elevation data itself.
