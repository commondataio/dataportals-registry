description: Open data portal of Chile's Ministry of Social Development and Family.
  Publishes social and public-investment datasets including CASEN survey microdata,
  the Social Household Registry, socioterritorial vulnerability indicators, social
  programs, and public investment projects. Open data is released under Creative Commons
  Attribution 4.0; the Social Information Registry (RIS) is restricted to public institutions
  and accredited researchers.
