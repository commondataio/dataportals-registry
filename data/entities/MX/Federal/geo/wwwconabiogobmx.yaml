description: CONABIO geoportal of the National Biodiversity Information System (SNIB).
  It lets users search, view, and download multiscale geographic information generated
  or compiled by CONABIO, including biodiversity, topography, hydrology, soils, geology,
  climate, vegetation and land use, political division, population, infrastructure,
  regionalization, satellite products, risk, and production. Cartography is available
  as shapefiles with FGDC metadata.
